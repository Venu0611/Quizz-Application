# 1. DYNAMIC PORT BINDING (Critical for Railway)
# Uses Railway's assigned port in production, falls back to 9092 on your local machine
server.port=${PORT:9092}

# 2. DYNAMIC DATABASE URL
# Uses Railway's environment variables in production, falls back to your local mysql setup
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/curd_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. HIKARI CONNECTION POOL SETTINGS
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# 4. JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true